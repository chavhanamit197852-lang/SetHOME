<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Request Home | SetHome</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<header class="site-header">

    <div class="container nav-wrap">

        <a href="index.html" class="brand">
            SetHome
        </a>

        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </div>

</header>

<main>

    <section class="contact-page">

        <div class="container">

            <div class="section-heading">

                <h1>
                    Request This Home
                </h1>

                <p>
                    Tell us a little about yourself and we'll review your request.
                </p>

            </div>

            <div id="selectedRoom">
                Loading home details...
            </div>

            <form
                id="requestForm"
                class="contact-form"
            >

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="18"
                        max="100"
                        placeholder="Enter your age"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="occupation">
                        Occupation
                    </label>

                    <input
                        type="text"
                        id="occupation"
                        name="occupation"
                        placeholder="e.g. Software Engineer"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="qualification">
                        Qualification
                    </label>

                    <input
                        type="text"
                        id="qualification"
                        name="qualification"
                        placeholder="e.g. B.E. Computer Engineering"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="puneDuration">
                        How long will you stay in Pune?
                    </label>

                    <select
                        id="puneDuration"
                        name="puneDuration"
                        required
                    >
                        <option value="">Select duration</option>
                        <option value="Less than 3 months">Less than 3 months</option>
                        <option value="3-6 months">3-6 months</option>
                        <option value="6-12 months">6-12 months</option>
                        <option value="1-2 years">1-2 years</option>
                        <option value="2+ years">2+ years</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="message">
                        Additional Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Tell us when you would like to visit or any other details."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                    id="submitRequestBtn"
                >
                    Send Home Request
                </button>


                <p
                    id="requestStatus"
                    class="form-status"
                ></p>

            </form>

        </div>

    </section>

</main>

<script src="js/request-home.js"></script>

</body>

</html>
