<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendor Dashboard | SetHome</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">

    <div class="container nav-wrap">

        <a href="index.html" class="brand">
            SetHome
        </a>

        <div class="vendor-nav-actions">

            <a href="index.html" class="btn btn-secondary">
                View Website
            </a>

            <button
                type="button"
                id="vendorLogoutBtn"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main>

    <section class="section">

        <div class="container">

            <div class="form-heading">

                <span class="eyebrow">
                    Vendor Panel
                </span>

                <h1>Vendor Dashboard</h1>

                <p id="vendorWelcome">
                    Manage your room listings.
                </p>

            </div>


            <!-- STATISTICS -->

            <div class="vendor-stats">

                <div class="vendor-stat-card">
                    <span>Total Listings</span>
                    <strong id="totalListings">0</strong>
                </div>

                <div class="vendor-stat-card">
                    <span>Pending</span>
                    <strong id="pendingListings">0</strong>
                </div>

                <div class="vendor-stat-card">
                    <span>Approved</span>
                    <strong id="approvedListings">0</strong>
                </div>

                <div class="vendor-stat-card">
                    <span>Rejected</span>
                    <strong id="rejectedListings">0</strong>
                </div>

            </div>


            <!-- ACTIONS -->

            <div class="vendor-dashboard-actions">

                <a
                    href="list-room.html"
                    class="btn btn-primary"
                >
                    + List New Room
                </a>

                <button
                    type="button"
                    id="refreshVendorRooms"
                    class="btn btn-secondary"
                >
                    Refresh
                </button>

            </div>


            <div
                id="vendorStatus"
                class="form-status"
            ></div>


            <!-- LISTINGS -->

            <div class="vendor-section-heading">

                <h2>My Listings</h2>

                <p>
                    Only rooms submitted from your vendor account
                    are shown here.
                </p>

            </div>


            <div
                id="vendorRooms"
                class="vendor-room-grid"
            ></div>

        </div>

    </section>

</main>


<script src="js/vendor-dashboard.js"></script>

</body>
</html>
