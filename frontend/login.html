<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SetHome</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main>

        <section class="auth-page">

            <div class="auth-card">


                <div class="auth-header">

                    <h1>
                        Welcome Back
                    </h1>

                    <p>
                        Login to your SetHome account.
                    </p>

                </div>


                <form id="loginForm">


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Login
                    </button>


                    <p
                        id="loginStatus"
                        class="form-status"
                        aria-live="polite"
                    ></p>


                </form>


                <div class="auth-footer">

                    <p class="register-link">
                        Don't have an account?

                        <a href="register.html" id="registerLink">
                            Register
                        </a>
                    </p>

                </div>


            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
