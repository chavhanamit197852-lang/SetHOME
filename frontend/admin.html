<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | SetHome</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">

    <nav class="navbar container">

        <a href="admin.html" class="brand">
            <span class="brand-mark">S</span>
            <span>SetHome Admin</span>
        </a>

        <div class="admin-nav-actions">

            <a href="index.html" class="btn btn-primary">
                View Website
            </a>

            <button
                type="button"
                class="btn btn-secondary"
                id="adminLogoutBtn"
            >
                Logout
            </button>

        </div>

    </nav>

</header>


<main>

    <section class="page-hero">
        <div class="container">

            <span class="eyebrow">
                ADMINISTRATION
            </span>

            <h1>Admin Dashboard</h1>

            <p>
                Review and manage submitted room listings.
            </p>

        </div>
    </section>


    <section class="section section-muted">

        <div class="container">

            <div class="admin-welcome">
                <div>
                    <span class="eyebrow blue">
                        ROOM MANAGEMENT
                    </span>

                    <h2>Pending Listings</h2>

                    <p>
                        Review vendor submissions before they become public.
                    </p>
                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="refreshRoomsBtn"
                >
                    Refresh
                </button>
            </div>


            <div
                id="adminStatus"
                class="form-status"
            ></div>


            <div
                id="pendingRooms"
                class="admin-room-grid"
            ></div>

        </div>

    </section>

</main>


<script src="js/admin.js"></script>

</body>

</html>
